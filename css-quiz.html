<!DOCTYPE html>
<html lang="hu">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="CSS kvíz kezdőknek és 9. osztályos tanulóknak." />
    <title>CSS kvíz | Code Arena</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%23150d18'/%3E%3Cpath d='M18 22 8 32l10 10M46 22l10 10-10 10M37 16 27 48' fill='none' stroke='%23ff6b8a' stroke-width='6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="standalone-quiz css-quiz-page">
    <main class="standalone-shell">
      <nav class="quiz-nav" aria-label="Kvízválasztó">
        <a class="quiz-brand" href="index.html"><span class="quiz-brand-icon" aria-hidden="true">&lt;/&gt;</span>Code Arena</a>
        <div class="quiz-links">
          <a class="quiz-link" href="html-quiz.html">HTML kvíz</a>
          <a class="quiz-link active" href="css-quiz.html">CSS kvíz</a>
        </div>
      </nav>
      <header class="standalone-hero">
        <span class="standalone-kicker">02 / CSS alapok</span>
        <h1>CSS kvíz</h1>
        <p>9. osztályos gyakorló kvíz az alapvető CSS-tulajdonságokról és szelektorokról.</p>
      </header>
      <form class="standalone-form" id="css-quiz-form">
        <div class="standalone-progress"><span id="css-progress">1 / 10</span><span id="css-score">0 pont</span></div>
        <div id="css-question"></div>
        <div class="standalone-actions">
          <button class="quiz-button secondary" type="button" id="css-prev" disabled>Előző</button>
          <button class="quiz-button" type="button" id="css-next">Következő</button>
          <button class="quiz-button hidden" type="submit" id="css-finish">Eredmény</button>
        </div>
      </form>
      <button class="quiz-button standalone-review-button hidden" type="button" id="css-review-button">Eredmény megtekintése</button>
      <section class="standalone-review hidden" id="css-review-panel" aria-live="polite">
        <div class="review-header">
          <div>
            <span class="standalone-kicker">Összesítés</span>
            <h2>CSS kvíz eredménye</h2>
          </div>
          <button class="quiz-button secondary" type="button" id="css-back-button">Vissza a kvízhez</button>
        </div>
        <div class="standalone-review-list" id="css-review-list"></div>
      </section>
    </main>
    <script>
      const cssQuestions = [
        ["Melyik tulajdonság állítja be a szöveg színét?", ["text-color", "font-color", "color", "foreground"], 2],
        ["Melyik szelektor jelöl egy class nevű osztályt?", ["#class", ".class", "class", "@class"], 1],
        ["Melyik tulajdonság állítja be a külső margót?", ["padding", "space", "margin", "gap"], 2],
        ["Melyik tulajdonság állítja be a belső térközt?", ["inside-space", "padding", "margin", "border-gap"], 1],
        ["Melyik deklaráció teszi rácsossá az elemet?", ["layout: grid", "position: grid", "display: grid", "grid: true"], 2],
        ["Melyik tulajdonság változtatja meg a betűméretet?", ["font-size", "text-size", "font-height", "size"], 0],
        ["Melyik szelektor jelöl egy id azonosítót?", [".azonosito", "id.azonosito", "#azonosito", "@azonosito"], 2],
        ["Melyik tulajdonság állítja be az elem háttérszínét?", ["background-color", "back-color", "color-background", "fill-color"], 0],
        ["Melyik érték igazítja középre a flex-elemeket a főtengelyen?", ["align-items: center", "justify-content: center", "text-align: center", "place: center"], 1],
        ["Melyik tulajdonság változtatja meg egy elem szélességét?", ["size", "width", "element-width", "scale"], 1]
      ];
      const cssExtraAnswers = [
        "height", "font-family", "display: flex", "border", "border-radius", "rem", "*", "line-height", "background-image", ":hover",
        "justify-content", "align-items", "text-align", "font-weight", "display: block", "display: inline", "display: inline-block", "grid-template-columns", "grid-template-rows", "gap",
        "flex-wrap", "display: none", "cursor", "cursor: pointer", "box-shadow", "text-shadow", "letter-spacing", "word-spacing", "text-transform: uppercase", "text-decoration: underline",
        "list-style-type", "list-style: none", "background-repeat", "background-position: center", "background-size", "border-style", "border-width", "border-color", "border-radius: 50%", "margin",
        "margin-top", "margin-right", "margin-bottom", "margin-left", "padding", "padding-top", "padding-right", "padding-bottom", "padding-left", "min-width",
        "max-width", "min-height", "max-height", "px", "%", "vw", "vh", "em", ".menu", "#header", "p", "h1 p",
        "div > p", "h1 + p", "[type=\"text\"]", ":focus", ":visited", "::before", "::after", "content", "position: relative", "position: absolute",
        "position: static", "top", "right", "bottom", "left", "transition", "transition-duration", "transform", "scale(1.1)", "box-sizing", "box-sizing: border-box"
      ];
      cssQuestions.push(...cssExtraAnswers.map((answer) => [
        `Melyik CSS-megoldást kell beírni ehhez a témához: ${answer}?`,
        [answer],
        0
      ]));
      function shuffleQuestions(questions) {
        return [...questions].sort(() => Math.random() - 0.5);
      }
      const shuffledCssQuestions = shuffleQuestions(cssQuestions).slice(0, 29);
      let cssIndex = 0;
      let cssAnswers = [];
      const cssQuestion = document.getElementById("css-question");
      const cssProgress = document.getElementById("css-progress");
      const cssScore = document.getElementById("css-score");
      const cssPrev = document.getElementById("css-prev");
      const cssNext = document.getElementById("css-next");
      const cssFinish = document.getElementById("css-finish");
      const cssReviewButton = document.getElementById("css-review-button");
      const cssReviewPanel = document.getElementById("css-review-panel");
      const cssReviewList = document.getElementById("css-review-list");
      const cssBackButton = document.getElementById("css-back-button");

      function escapeHtml(value) {
        return value.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/\"/g, "&quot;");
      }

      function renderCssQuestion() {
        const [question, answers] = shuffledCssQuestions[cssIndex];
        cssQuestion.innerHTML = `<h2>${cssIndex + 1}. ${question}</h2><label class="written-answer-label" for="css-answer">Írd be a válaszodat:</label><input class="standalone-answer-input" id="css-answer" type="text" name="css-answer" value="${escapeHtml(cssAnswers[cssIndex] || "")}" autocomplete="off" placeholder="Írd be a válaszodat..." />`;
        cssProgress.textContent = `${cssIndex + 1} / ${shuffledCssQuestions.length}`;
        cssScore.textContent = `${cssAnswers.filter((answer) => answer !== undefined).length} megválaszolva`;
        cssPrev.disabled = cssIndex === 0;
        cssNext.classList.toggle("hidden", cssIndex === shuffledCssQuestions.length - 1);
        cssFinish.classList.toggle("hidden", cssIndex !== shuffledCssQuestions.length - 1);
      }

      function saveCssAnswer() { const answer = cssQuestion.querySelector(".standalone-answer-input"); if (answer) cssAnswers[cssIndex] = answer.value.trim(); }
      cssNext.addEventListener("click", () => { saveCssAnswer(); cssIndex += 1; renderCssQuestion(); });
      cssPrev.addEventListener("click", () => { saveCssAnswer(); cssIndex -= 1; renderCssQuestion(); });
      document.getElementById("css-quiz-form").addEventListener("submit", (event) => {
        event.preventDefault(); saveCssAnswer();
        cssReviewButton.classList.remove("hidden");
        cssReviewButton.focus();
      });

      cssReviewButton.addEventListener("click", () => {
        cssReviewList.replaceChildren();
        shuffledCssQuestions.forEach(([question, answers, correctIndex], index) => {
          const userIndex = cssAnswers[index];
          const isCorrect = normalizeAnswer(cssAnswers[index]) === normalizeAnswer(answers[correctIndex]);
          const item = document.createElement("article");
          item.className = `review-item ${isCorrect ? "review-correct" : "review-wrong"}`;
          item.innerHTML = `<h3>${index + 1}. ${question}</h3><p>A te válaszod: ${escapeHtml(cssAnswers[index] || "Nincs válasz")}</p><p>Helyes válasz: ${escapeHtml(answers[correctIndex])}</p>`;
          cssReviewList.append(item);
        });
        document.getElementById("css-quiz-form").classList.add("hidden");
        cssReviewButton.classList.add("hidden");
        cssReviewPanel.classList.remove("hidden");
        cssReviewPanel.scrollIntoView({ behavior: "smooth", block: "start" });
      });

      cssBackButton.addEventListener("click", () => {
        cssReviewPanel.classList.add("hidden");
        document.getElementById("css-quiz-form").classList.remove("hidden");
        cssReviewButton.classList.remove("hidden");
        document.getElementById("css-quiz-form").scrollIntoView({ behavior: "smooth", block: "start" });
      });
      function normalizeAnswer(value) {
        return (value || "").toLowerCase().replace(/[<>]/g, "").replace(/\s+/g, " ").trim();
      }
      renderCssQuestion();
    </script>
  </body>
</html>
